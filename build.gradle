plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = "shedaniel"
		url = "https://maven.shedaniel.me/"
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"aionminecraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cloth Config, for the in-game settings screen (provider/model/API key).
	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// Mod Menu, OPTIONAL: only used to show a settings gear icon in the mods
	// list. modCompileOnly means we compile against its API but don't bundle
	// it or require it at runtime — see ModMenuIntegration.java and the
	// "modmenu" entrypoint + "suggests" entry in fabric.mod.json for how the
	// soft dependency is wired up. The version below is a PLACEHOLDER: check
	// https://modrinth.com/mod/modmenu/versions for the current build that
	// targets Minecraft 26.2 and update modmenu_version in gradle.properties
	// (and modmenu_maven_version_id with the matching Version ID from that
	// page) before building.
	modCompileOnly "maven.modrinth:mOgUt4GM:${project.modmenu_maven_version_id}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
