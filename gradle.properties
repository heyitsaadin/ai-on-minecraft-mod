# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
version=1.0.0
group=com.aionmc.mod

# Dependencies
fabric_api_version=0.160.0+26.2
cloth_config_version=26.2.155

# Mod Menu (OPTIONAL, for the settings-gear icon in the mods list).
# PLACEHOLDER — replace with the real Modrinth "Version ID" for the Mod Menu
# build that targets Minecraft 26.2. Find it at:
#   https://modrinth.com/mod/modmenu/versions
# Click the 26.2-compatible release, then copy the "Version ID" shown on
# that page (a short alphanumeric code, e.g. "JPP6w2U1" for an old example).
# The game will build and run fine without Mod Menu installed either way —
# this only affects whether the gear-icon integration compiles correctly.
modmenu_maven_version_id=REPLACE_ME_WITH_VERSION_ID_FROM_MODRINTH
